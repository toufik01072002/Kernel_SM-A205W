name: Build SM-A205W Alpine Kernel (Wi-Fi + BT)
# Trigger build after sec_ext.h compatibility fix

on:
  push:
    branches:
      - kexec-arm64-4.4-d-work
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies and aarch64 GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev libncurses5-dev lzop python2 python3 wget xz-utils zip

      - name: Configure and Build Kernel Image
        run: |
          export PLATFORM_VERSION=11
          export ANDROID_MAJOR_VERSION=r
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          mkdir -p out/arch/arm64/boot
          cp arch/arm64/configs/alpine_a20_wifi_bt_defconfig out/.config
          bash ./scripts/config --file out/.config --enable CONFIG_CGROUPS --enable CONFIG_CGROUP_SCHED --enable CONFIG_FAIR_GROUP_SCHED --enable CONFIG_RT_GROUP_SCHED --enable CONFIG_SCHED_TUNE
          make O=out ARCH=arm64 olddefconfig
          make O=out ARCH=arm64 KCFLAGS="-Wno-error" vmlinux -j$(nproc)

          ${CROSS_COMPILE}objcopy -O binary -R .note -R .note.gnu.build-id -R .comment -S out/vmlinux out/arch/arm64/boot/Image
          gzip -9 -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image*

      - name: Upload compiled Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: SM-A205W-Alpine-Kernel-WiFi-BT
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/.config
